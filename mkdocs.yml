site_name: Introducción a Python
site_description: Apuntes y ejercicios de introducción a Python para ciclos formativos
  de informática
site_author: Victoria
site_url: https://victoria-nr.github.io/python-intro-alumnos/
repo_name: python-intro-alumnos
repo_url: https://github.com/victoria-nr/python-intro-alumnos
edit_uri: ''
theme:
  name: material
  language: es
  features:
  - navigation.sections
  - navigation.expand
  - navigation.top
  - search.highlight
  - search.suggest
  - content.code.copy
  - content.tabs.link
  palette:
  - scheme: default
    primary: blue
    accent: indigo
markdown_extensions:
- admonition
- attr_list
- md_in_html
- toc:
    permalink: true
- pymdownx.highlight:
    anchor_linenums: true
- pymdownx.inlinehilite
- pymdownx.superfences
- pymdownx.details
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.tasklist:
    custom_checkbox: true
not_in_nav: '**/archivos-solucion/**'
nav:
- Inicio: index.md
- Metodología flipped: metodologia-flipped.md
- Instalación: instalacion.md
- Git y GitHub para entregas: git-github-entregas.md
- Entregas: entregas.md
- Planificacion del curso: planificacion.md
- Unidades:
  - UT1 - Introducción, entorno y tipos de datos:
    - Presentación: unidades/u01-introduccion-python/index.md
    - Alineación RA: unidades/u01-introduccion-python/alineacion-ra.md
    - Teoría:
      - Introducción a Python: unidades/u01-introduccion-python/teoria/01-introduccion-python.md
      - Entorno de desarrollo: unidades/u01-introduccion-python/teoria/02-entorno-vscode.md
      - Datos y variables: unidades/u01-introduccion-python/teoria/03-datos-variables.md
      - Números y operadores: unidades/u01-introduccion-python/teoria/04-numeros-operadores.md
      - Cadenas y entrada/salida: unidades/u01-introduccion-python/teoria/05-cadenas-entrada-salida.md
    - Ejercicios:
      - Índice: unidades/u01-introduccion-python/ejercicios/index.md
      - Practicar: unidades/u01-introduccion-python/ejercicios/practicar/index.md
