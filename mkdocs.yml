# Archivo generado automáticamente desde public-manifest.yml y public/mkdocs-base.yml.
# No editar a mano: regenera con `python3 scripts/generar_nav_mkdocs.py`.

site_name: Introducción a Python
site_description: Apuntes y ejercicios de introducción a Python para ciclos formativos
  de informática
site_author: Victoria
site_url: https://victoria-nr.github.io/python-intro-alumnos/
repo_name: python-intro-alumnos
repo_url: https://github.com/victoria-nr/python-intro-alumnos
edit_uri: ''
theme:
  name: material
  language: es
  features:
  - navigation.sections
  - navigation.expand
  - navigation.top
  - search.highlight
  - search.suggest
  - content.code.copy
  - content.tabs.link
  palette:
  - scheme: default
    primary: blue
    accent: indigo
markdown_extensions:
- admonition
- attr_list
- md_in_html
- toc:
    permalink: true
- pymdownx.highlight:
    anchor_linenums: true
- pymdownx.inlinehilite
- pymdownx.superfences
- pymdownx.details
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.tasklist:
    custom_checkbox: true
not_in_nav: '**/archivos-solucion/**'
nav:
- Inicio: index.md
- Metodología flipped: metodologia-flipped.md
- Instalación: instalacion.md
- Git y GitHub para entregas: git-github-entregas.md
- Entregas: entregas.md
- Planificacion del curso: planificacion.md
